name: mypy

on:
  push:
  pull_request:
  merge_group:

jobs:
  mypy:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
      - name: Install poetry
        run: pipx install poetry
      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
          cache: "poetry"
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          python -m pip install --upgrade poetry
          poetry install -E dev

      - name: Analysing the code with mypy
        run: |
          # mypy is not clean yet, so just make sure it does not get worse.
          # Count it against the locked dependencies, as a local run with newer
          # typing stubs will report a different number.
          MAX_ERRORS=481
          poetry run mypy mirar --ignore-missing-imports | tee mypy.log || true
          N_ERRORS=$(grep -c ": error:" mypy.log || true)
          echo "Found $N_ERRORS mypy errors, allowing up to $MAX_ERRORS"
          if [ "$N_ERRORS" -gt "$MAX_ERRORS" ]; then
            echo "mypy errors increased, please fix them"
            exit 1
          fi

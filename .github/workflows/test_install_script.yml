name: Install script

on:
  push:
  pull_request:
  merge_group:
  schedule:
    - cron: '0 0 1,15 * *'
  workflow_dispatch:

jobs:
  test_install:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniconda-version: "latest"
          auto-update-conda: true

      - name: Run install script
        run: |
          bash install_mirar.sh mirar

      - name: Verify tools
        shell: bash -el {0}
        run: |
          conda activate mirar
          solve-field --version
          swarp -v
          psfex -v
          sex -v
          scamp -v
          python --version

      - name: Run doc tests
        shell: bash -el {0}
        run: |
          conda activate mirar
          make -C docs/ doctest

      # The cached test values are platform-specific, so macOS needs its own run
      - name: Set up ssh for the test data
        if: runner.os == 'macOS'
        uses: webfactory/ssh-agent@v0.5.4
        with:
          ssh-private-key: |
            ${{ secrets.WIRC_STARTERPACK_TOKEN }}

      - name: Run a pipeline test
        if: runner.os == 'macOS'
        shell: bash -el {0}
        env:
          OUTPUT_DATA_DIR: /Users/runner/
          TESTDATA_CHECK: "True"
        run: |
          conda activate mirar
          python -m unittest tests.test_summer_imsub_pipeline
